name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # 2️⃣ Set up Node 22
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install
        working-directory: ./react-with-flask

      # 4️⃣ Skip tests (no test script yet)
      # - name: Run tests
      #   run: npm test
      #   working-directory: ./react-with-flask

      # 5️⃣ Build React app
      - name: Build app
        run: npm run build
        working-directory: ./react-with-flask

      # 6️⃣ Optional: deploy to Vercel later
      # - name: Deploy to Vercel
      #   uses: amondnet/vercel-action@v20
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     working-directory: ./react-with-flask
      #     prod: true
